<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soğuk Bir Akşam ❄️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Trebuchet MS", sans-serif;
    background: #161a2b;
}

/* ================= ODA ================= */

.room {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(to bottom, #252b45 0%, #303652 65%, #24283d 65%, #1d2133 100%);
}

/* Duvar ışığı */

.lamp-light {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 650px;
    height: 500px;
    background: radial-gradient(
        ellipse,
        rgba(255,220,155,.20) 0%,
        rgba(255,220,155,.08) 35%,
        transparent 70%
    );
    pointer-events: none;
}

/* Pencere */

.window {
    position: absolute;
    left: 9%;
    top: 11%;
    width: 210px;
    height: 190px;
    background: linear-gradient(#9db8d4, #dcecff);
    border: 10px solid #684e62;
    border-radius: 8px;
    box-shadow: 0 12px 35px rgba(0,0,0,.35);
    overflow: hidden;
}

.window::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 7px;
    height: 100%;
    background: #684e62;
}

.window::after {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: 7px;
    background: #684e62;
}

.moon {
    position: absolute;
    width: 48px;
    height: 48px;
    right: 30px;
    top: 25px;
    border-radius: 50%;
    background: #fff4ce;
    box-shadow: 0 0 25px rgba(255,244,206,.8);
}

.snow {
    position: absolute;
    color: white;
    font-size: 14px;
    animation: snow 5s linear infinite;
}

.s1 { left: 20px; top: -20px; animation-delay: 0s; }
.s2 { left: 75px; top: -60px; animation-delay: 1s; }
.s3 { left: 130px; top: -30px; animation-delay: 2s; }
.s4 { left: 180px; top: -80px; animation-delay: .5s; }

@keyframes snow {
    to {
        transform: translateY(250px) rotate(180deg);
    }
}

/* Duvar süsü */

.picture {
    position: absolute;
    right: 12%;
    top: 15%;
    width: 120px;
    height: 95px;
    background: #d5a6a6;
    border: 8px solid #80616c;
    border-radius: 5px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

.picture::after {
    content: "🌸";
    position: absolute;
    font-size: 45px;
    left: 30px;
    top: 17px;
}

/* Zemin */

.floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 35%;
    background:
        repeating-linear-gradient(
            90deg,
            #363044 0px,
            #363044 80px,
            #302a3d 82px,
            #302a3d 160px
        );
}

/* Halı */

.rug {
    position: absolute;
    width: 650px;
    height: 170px;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    background: #80657b;
    border-radius: 50%;
    opacity: .65;
}

/* ================= YATAK ================= */

.bed {
    position: absolute;
    width: 650px;
    height: 210px;
    left: 50%;
    bottom: 13%;
    transform: translateX(-50%);
}

/* Başlık */

.headboard {
    position: absolute;
    right: 0;
    bottom: 40px;
    width: 150px;
    height: 220px;
    background: linear-gradient(90deg, #754f5c, #956a76);
    border-radius: 18px 18px 0 0;
    box-shadow: inset 0 0 20px rgba(0,0,0,.2);
}

/* Yatak */

.mattress {
    position: absolute;
    left: 25px;
    bottom: 35px;
    width: 550px;
    height: 115px;
    background: #f0d9dd;
    border-radius: 35px;
    box-shadow: 0 15px 20px rgba(0,0,0,.25);
}

/* Yastık */

.pillow {
    position: absolute;
    right: 85px;
    bottom: 110px;
    width: 150px;
    height: 65px;
    background: #fff2f0;
    border-radius: 45%;
    box-shadow: 0 5px 10px rgba(0,0,0,.15);
}

/* ================= KARAKTER ================= */

.character {
    position: absolute;
    z-index: 10;
    left: 130px;
    bottom: 132px;
    width: 150px;
    height: 250px;

    animation:
        walkToBed 3s ease-in-out forwards,
        settle 2s ease-in-out 3s forwards;
}

/* Karakter yatağa doğru ilerliyor */

@keyframes walkToBed {
    0% {
        transform: translate(-180px, 80px);
    }

    60% {
        transform: translate(-40px, 20px);
    }

    100% {
        transform: translate(0, 0);
    }
}

/* Yatağa oturma */

@keyframes settle {
    0% {
        transform: translateY(0);
    }

    100% {
        transform: translateY(45px) scale(.95);
    }
}

/* Saç */

.hair {
    position: absolute;
    z-index: 3;
    left: 20px;
    top: 0;
    width: 110px;
    height: 105px;
    background: #704a86;
    border-radius: 55% 55% 45% 45%;
    box-shadow: inset -8px -5px rgba(50,25,70,.15);
}

/* Saç tutamları */

.hair::before,
.hair::after {
    content: "";
    position: absolute;
    background: #704a86;
    width: 35px;
    height: 90px;
    border-radius: 50%;
    bottom: -30px;
}

.hair::before {
    left: 5px;
    transform: rotate(15deg);
}

.hair::after {
    right: 5px;
    transform: rotate(-15deg);
}

/* Yüz */

.face {
    position: absolute;
    z-index: 4;
    left: 28px;
    top: 20px;
    width: 95px;
    height: 105px;
    background: #ffd7c4;
    border-radius: 48% 48% 45% 45%;
}

/* Gözler */

.eye {
    position: absolute;
    top: 52px;
    width: 17px;
    height: 25px;
    background: #493450;
    border-radius: 50%;
}

.eye::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 6px;
    height: 8px;
    background: white;
    border-radius: 50%;
}

.eye.left {
    left: 20px;
}

.eye.right {
    right: 20px;
}

/* Yanak */

.cheek {
    position: absolute;
    top: 78px;
    width: 18px;
    height: 9px;
    background: #f59b9b;
    border-radius: 50%;
    opacity: .65;
}

.cheek.left {
    left: 10px;
}

.cheek.right {
    right: 10px;
}

/* Ağız */

.mouth {
    position: absolute;
    left: 42px;
    top: 82px;
    width: 12px;
    height: 7px;
    border-bottom: 3px solid #8b5260;
    border-radius: 50%;
}

/* Boyun */

.neck {
    position: absolute;
    z-index: 2;
    left: 61px;
    top: 112px;
    width: 30px;
    height: 25px;
    background: #ffd7c4;
}

/* Pijama */

.pajamas {
    position: absolute;
    z-index: 2;
    left: 20px;
    top: 125px;
    width: 110px;
    height: 115px;
    background: #8ea9d5;
    border-radius: 40px 40px 20px 20px;
    border: 3px solid #536d9c;
}

/* Kollar */

.arm {
    position: absolute;
    z-index: 5;
    top: 135px;
    width: 32px;
    height: 85px;
    background: #ffd7c4;
    border-radius: 20px;
}

.arm.left {
    left: 8px;
    transform: rotate(18deg);
}

.arm.right {
    right: 8px;
    transform: rotate(-18deg);
}

/* ================= BATTANİYE ================= */

.blanket {
    position: absolute;
    z-index: 20;
    left: 50%;
    bottom: 18%;
    width: 550px;
    height: 155px;
    transform: translateX(-50%);
    background:
        linear-gradient(135deg, #9a78c5, #76569f);
    border-radius: 80px 80px 35px 35px;
    border: 4px solid #634685;
    box-shadow:
        0 15px 30px rgba(0,0,0,.25),
        inset 0 10px 20px rgba(255,255,255,.12);

    animation: blanketPull 2.5s ease-in-out 4.5s forwards;
}

/* Battaniye deseni */

.blanket::before {
    content: "✦  ✧  ✦  ✧  ✦  ✧  ✦";
    position: absolute;
    width: 100%;
    text-align: center;
    top: 65px;
    color: #dfcef5;
    font-size: 25px;
    opacity: .8;
}

/* Battaniye karakterin üzerine geliyor */

@keyframes blanketPull {
    0% {
        transform: translateX(-50%) translateY(0);
        height: 155px;
    }

    50% {
        transform: translateX(-50%) translateY(-35px);
    }

    100% {
        transform: translateX(-50%) translateY(-20px);
        height: 190px;
    }
}

/* Battaniyenin üstündeki kafa */

.headPeek {
    position: absolute;
    z-index: 25;
    left: 50%;
    bottom: 37%;
    transform: translateX(-50%) translateY(30px);
    width: 95px;
    height: 80px;
    background: #ffd7c4;
    border-radius: 50%;
    opacity: 0;

    animation: peek 2s ease-in-out 4s forwards;
}

@keyframes peek {
    0% {
        opacity: 0;
        transform: translateX(-50%) translateY(35px);
    }

    100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

/* Saç üstü */

.headPeek::before {
    content: "";
    position: absolute;
    left: -4px;
    top: -20px;
    width: 105px;
    height: 55px;
    background: #704a86;
    border-radius: 55% 55% 30% 30%;
}

/* Gözler */

.headPeek .eye {
    position: absolute;
    z-index: 2;
    top: 43px;
    width: 12px;
    height: 17px;
}

.headPeek .eye.left {
    left: 24px;
}

.headPeek .eye.right {
    right: 24px;
}

/* ================= SICAKLIK ================= */

.heat {
    position: absolute;
    z-index: 30;
    left: 50%;
    bottom: 44%;
    transform: translateX(-50%);
    font-size: 22px;
    opacity: 0;

    animation: warm 3s ease-in-out 6s infinite;
}

@keyframes warm {
    0% {
        opacity: 0;
        transform: translate(-50%, 10px);
    }

    40% {
        opacity: .7;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -35px);
    }
}

/* ================= YAZI ================= */

.message {
    position: absolute;
    z-index: 50;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #f7eefa;
    font-size: 20px;
    text-shadow: 0 2px 5px #111;
    opacity: 0;

    animation: message 2s ease-in-out 6s forwards;
}

@keyframes message {
    to {
        opacity: 1;
    }
}

/* Küçük yıldızlar */

.sparkles {
    position: absolute;
    z-index: 40;
    left: 50%;
    bottom: 35%;
    transform: translateX(-50%);
    color: #fff0a8;
    font-size: 24px;
    opacity: 0;

    animation: sparkle 2s ease-in-out 6s infinite;
}

@keyframes sparkle {
    0%, 100% {
        opacity: 0;
        transform: translateX(-50%) scale(.8);
    }

    50% {
        opacity: 1;
        transform: translateX(-50%) scale(1.2);
    }
}
</style>
</head>

<body>

<div class="room">

    <div class="lamp-light"></div>

    <!-- Pencere -->
    <div class="window">
        <div class="moon"></div>
        <span class="snow s1">❄</span>
        <span class="snow s2">❄</span>
        <span class="snow s3">❄</span>
        <span class="snow s4">❄</span>
    </div>

    <!-- Duvar resmi -->
    <div class="picture"></div>

    <!-- Zemin -->
    <div class="floor"></div>
    <div class="rug"></div>

    <!-- Yatak -->
    <div class="bed">
        <div class="headboard"></div>
        <div class="mattress"></div>
        <div class="pillow"></div>
    </div>

    <!-- Anime karakter -->
    <div class="character">

        <div class="hair"></div>

        <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="cheek left"></div>
            <div class="cheek right"></div>

            <div class="mouth"></div>
        </div>

        <div class="neck"></div>
        <div class="pajamas"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

    </div>

    <!-- Battaniye -->
    <div class="blanket"></div>

    <!-- Battaniyenin üstünden görünen kafa -->
    <div class="headPeek">
        <div class="eye left"></div>
        <div class="eye right"></div>
    </div>

    <!-- Sıcaklık efekti -->
    <div class="heat">♨️ ♨️ ♨️</div>

    <div class="sparkles">✦ ✧ ✦</div>

    <div class="message">
        Ohh... şimdi sıcacık. 🥰🛌
    </div>

</div>

</body>
      </html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Üşüyen Anime Karakteri</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #1d2035;
    font-family: Arial, sans-serif;
}

/* ODA */
.room {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(
        #343653 0%,
        #292b46 65%,
        #5a4148 65%,
        #3d303b 100%
    );
}

/* AY */
.moon {
    position: absolute;
    width: 65px;
    height: 65px;
    right: 12%;
    top: 12%;
    border-radius: 50%;
    background: #fff3c4;
    box-shadow: 0 0 40px #fff3c4;
}

/* PENCERE */
.window {
    position: absolute;
    left: 8%;
    top: 12%;
    width: 210px;
    height: 180px;
    background: #18233d;
    border: 10px solid #715768;
    border-radius: 8px;
}

.window::before {
    content: "";
    position: absolute;
    width: 7px;
    height: 100%;
    background: #715768;
    left: 50%;
}

.window::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 7px;
    background: #715768;
    top: 50%;
}

/* KAR */
.snow {
    position: absolute;
    color: white;
    font-size: 18px;
    animation: fall 4s linear infinite;
}

.snow1 {
    left: 25px;
    top: -20px;
}

.snow2 {
    left: 100px;
    top: -80px;
    animation-delay: 1s;
}

.snow3 {
    left: 170px;
    top: -40px;
    animation-delay: 2s;
}

@keyframes fall {
    to {
        transform: translateY(220px);
    }
}

/* ZEMİN */
.floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 35%;
    background: repeating-linear-gradient(
        90deg,
        #684b52 0px,
        #684b52 90px,
        #60444b 90px,
        #60444b 180px
    );
}

/* HALI */
.rug {
    position: absolute;
    width: 650px;
    height: 180px;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #906779;
}

/* KOLTUK */
.couch {
    position: absolute;
    width: 500px;
    height: 190px;
    left: 50%;
    bottom: 20%;
    transform: translateX(-50%);
    background: #80627a;
    border-radius: 50px 50px 25px 25px;
    box-shadow: 0 15px 25px rgba(0,0,0,.4);
}

/* KOLTUK ARKASI */
.couch-back {
    position: absolute;
    width: 480px;
    height: 140px;
    left: 10px;
    top: -90px;
    background: #8e6b88;
    border-radius: 60px 60px 20px 20px;
}

/* YASTIK */
.pillow {
    position: absolute;
    width: 110px;
    height: 70px;
    background: #d5a5b4;
    border-radius: 40%;
    top: -55px;
}

.pillow.left {
    left: 50px;
}

.pillow.right {
    right: 50px;
}

/* =========================
   ANİME KARAKTERİ
========================= */

.character {
    position: absolute;
    z-index: 5;

    left: 50%;
    bottom: 32%;

    width: 170px;
    height: 270px;

    transform: translateX(-50%);

    animation: shiver .15s infinite;
}

/* ÜŞÜME */

@keyframes shiver {
    0% {
        transform: translateX(-50%) rotate(-1deg);
    }

    50% {
        transform: translateX(-50%) rotate(1deg);
    }

    100% {
        transform: translateX(-50%) rotate(-1deg);
    }
}

/* SAÇ */
.hair {
    position: absolute;
    z-index: 3;

    left: 25px;
    top: 0;

    width: 120px;
    height: 100px;

    background: #7652a1;

    border-radius: 60% 60% 45% 45%;
}

/* YÜZ */
.face {
    position: absolute;
    z-index: 4;

    left: 35px;
    top: 18px;

    width: 100px;
    height: 115px;

    background: #ffd7c2;

    border-radius: 50%;
}

/* SAÇ PERÇEMİ */
.bang {
    position: absolute;
    z-index: 7;

    left: 55px;
    top: 10px;

    width: 55px;
    height: 70px;

    background: #7652a1;

    border-radius: 0 0 50% 50%;

    transform: rotate(12deg);
}

/* GÖZ */
.eye {
    position: absolute;
    z-index: 10;

    top: 58px;

    width: 17px;
    height: 25px;

    background: #45324e;

    border-radius: 50%;
}

.eye::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 8px;

    background: white;

    border-radius: 50%;

    left: 3px;
    top: 3px;
}

.eye.left {
    left: 20px;
}

.eye.right {
    right: 20px;
}

/* YANAK */
.cheek {
    position: absolute;
    z-index: 10;

    top: 86px;

    width: 20px;
    height: 9px;

    background: #f295a2;

    border-radius: 50%;
}

.cheek.left {
    left: 8px;
}

.cheek.right {
    right: 8px;
}

/* AĞIZ */
.mouth {
    position: absolute;
    z-index: 10;

    left: 44px;
    top: 91px;

    width: 13px;
    height: 8px;

    border-bottom: 3px solid #98566a;

    border-radius: 50%;
}

/* GÖVDE */
.body {
    position: absolute;

    left: 30px;
    top: 125px;

    width: 110px;
    height: 125px;

    background: #9d7abd;

    border: 3px solid #493747;

    border-radius: 35px 35px 20px 20px;
}

/* KOLLAR */
.arm {
    position: absolute;
    z-index: 6;

    top: 140px;

    width: 35px;
    height: 95px;

    background: #ffd7c2;

    border: 3px solid #493747;

    border-radius: 30px;

    transition: 2s;
}

.arm.left {
    left: 8px;
    transform: rotate(15deg);
}

.arm.right {
    right: 8px;
    transform: rotate(-15deg);
}

/* ELLER */
.hand {
    position: absolute;

    z-index: 30;

    width: 30px;
    height: 30px;

    background: #ffd7c2;

    border: 3px solid #493747;

    border-radius: 50%;

    transition: 2s;
}

/* SOL EL */
.hand.left {
    left: 0;
    top: 205px;
}

/* SAĞ EL */
.hand.right {
    right: 0;
    top: 205px;
}

/* =========================
   BATTANİYE
========================= */

.blanket {
    position: absolute;

    z-index: 20;

    left: 50%;
    bottom: 23%;

    width: 430px;
    height: 145px;

    transform: translateX(-50%);

    background: linear-gradient(
        135deg,
        #a98bd4,
        #75569d
    );

    border: 5px solid #574475;

    border-radius: 80px 80px 30px 30px;

    box-shadow:
        0 15px 30px rgba(0,0,0,.35);

    transition: 2.5s ease;
}

/* BATTANİYE DESENİ */
.blanket::before {
    content: "✦   ♡   ✦   ♡   ✦";

    position: absolute;

    width: 100%;

    text-align: center;

    top: 55px;

    color: #eadcff;

    font-size: 24px;
}

/* =========================
   ANİMASYON BAŞLADIĞINDA
========================= */

/* Karakter battaniyenin altına eğiliyor */
.room.warm .character {
    animation: enterBlanket 3s ease forwards;
}

@keyframes enterBlanket {

    0% {
        bottom: 32%;
        transform: translateX(-50%);
    }

    50% {
        bottom: 27%;
        transform: translateX(-50%) scale(.95);
    }

    100% {
        bottom: 23%;
        transform: translateX(-50%) scale(.88);
    }
}

/* Battaniye yukarı geliyor */
.room.warm .blanket {
    bottom: 28%;

    height: 185px;

    animation: pullBlanket 3s ease forwards;
}

@keyframes pullBlanket {

    0% {
        transform: translateX(-50%);
    }

    45% {
        transform: translateX(-50%) translateY(-15px);
    }

    100% {
        transform: translateX(-50%) translateY(-35px);
    }
}

/* =========================
   ELLER BATTANİYEYİ TUTUYOR
========================= */

.blanket-hold {
    position: absolute;

    z-index: 40;

    width: 32px;
    height: 32px;

    background: #ffd7c2;

    border: 3px solid #493747;

    border-radius: 50%;

    opacity: 0;

    transition: 1s;
}

/* SOL EL */
.blanket-hold.left {
    left: calc(50% - 190px);
    bottom: 29%;
}

/* SAĞ EL */
.blanket-hold.right {
    left: calc(50% + 158px);
    bottom: 29%;
}

/* Eller battaniyeyi tutuyor */
.room.warm .blanket-hold {
    opacity: 1;
}

/* SOL EL YUKARI ÇEKİYOR */
.room.warm .blanket-hold.left {
    animation: leftPull 3s ease forwards;
}

@keyframes leftPull {

    0% {
        left: calc(50% - 190px);
        bottom: 29%;
    }

    45% {
        left: calc(50% - 190px);
        bottom: 34%;
    }

    100% {
        left: calc(50% - 160px);
        bottom: 40%;
    }
}

/* SAĞ EL YUKARI ÇEKİYOR */
.room.warm .blanket-hold.right {
    animation: rightPull 3s ease forwards;
}

@keyframes rightPull {

    0% {
        left: calc(50% + 158px);
        bottom: 29%;
    }

    45% {
        left: calc(50% + 158px);
        bottom: 34%;
    }

    100% {
        left: calc(50% + 130px);
        bottom: 40%;
    }
}

/* =========================
   SICAKLIK EFEKTİ
========================= */

.warm-air {
    position: absolute;

    z-index: 50;

    left: 50%;
    bottom: 42%;

    transform: translateX(-50%);

    color: #ffc978;

    font-size: 30px;

    opacity: 0;
}

.room.warm .warm-air {
    opacity: 1;

    animation: steam 2s infinite;
}

@keyframes steam {

    0% {
        transform: translate(-50%, 10px);
        opacity: 0;
    }

    50% {
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -30px);
        opacity: 0;
    }
}

/* YAZI */
.text {
    position: absolute;

    z-index: 100;

    top: 6%;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 24px;

    text-shadow: 0 3px 10px #111;

    opacity: 0;

    transition: 2s;
}

.room.warm .text {
    opacity: 1;
}
</style>
</head>

<body>

<div class="room" id="room">

    <!-- PENCERE -->
    <div class="window">
        <div class="moon"></div>

        <div class="snow snow1">❄</div>
        <div class="snow snow2">❄</div>
        <div class="snow snow3">❄</div>
    </div>

    <!-- ZEMİN -->
    <div class="floor"></div>

    <!-- HALI -->
    <div class="rug"></div>

    <!-- KOLTUK -->
    <div class="couch">
        <div class="couch-back"></div>

        <div class="pillow left"></div>
        <div class="pillow right"></div>
    </div>

    <!-- ANİME KARAKTERİ -->
    <div class="character">

        <div class="hair"></div>

        <div class="face">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="cheek left"></div>
            <div class="cheek right"></div>

            <div class="mouth"></div>

        </div>

        <div class="bang"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

    </div>

    <!-- BATTANİYE -->
    <div class="blanket"></div>

    <!-- BATTANİYEYİ TUTAN ELLER -->
    <div class="blanket-hold left"></div>
    <div class="blanket-hold right"></div>

    <!-- SICAK HAVA -->
    <div class="warm-air">
        ♨️ ♨️ ♨️
    </div>

    <!-- YAZI -->
    <div class="text">
        Ohh... şimdi sıcacık... ♡
    </div>

</div>

<script>

const room = document.getElementById("room");

/*
    1. Karakter önce üşüyor.
    2. Biraz bekliyor.
    3. Battaniyenin altına giriyor.
    4. Eller battaniyenin kenarını tutuyor.
    5. İki eliyle battaniyeyi yukarı çekiyor.
*/

setTimeout(function() {

    room.classList.add("warm");

}, 2500);

</script>

</body>
</html>
